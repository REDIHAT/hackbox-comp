name: Build HackBox Compliant Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO and esptool
      run: |
        python -m pip install --upgrade pip
        pip install platformio esptool

    - name: Build Firmware (hackbox-main)
      run: |
        platformio run -e hackbox-main

    - name: Generate Merged Binary
      run: |
        mkdir -p build_output
        cp .pio/build/hackbox-main/firmware.bin build_output/
        cp .pio/build/hackbox-main/bootloader.bin build_output/
        cp .pio/build/hackbox-main/partitions.bin build_output/
        
        # Merge into single flashable binary
        esptool.py --chip esp32 merge_bin -o build_output/hackbox-comp-merged.bin \
          --flash_mode dio --flash_size 4MB \
          0x1000 .pio/build/hackbox-main/bootloader.bin \
          0x8000 .pio/build/hackbox-main/partitions.bin \
          0x10000 .pio/build/hackbox-main/firmware.bin

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hackbox-comp-firmware
        path: build_output/
