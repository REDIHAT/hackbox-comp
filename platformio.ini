; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:hackbox-main]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
build_flags =
	-Wl,-z,muldefs
	-DCORE_DEBUG_LEVEL=0
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
build_src_filter =
	+<*>
lib_deps =
	nrf24/RF24@^1.4.10
	olikraus/U8g2@^2.36.2
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.4.2
	mikalhart/TinyGPSPlus@^1.0.3
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:hackbox-scout]
extends = env:hackbox-main
build_flags = ${env:hackbox-main.build_flags} -DHACKBOX_SCOUT_BUILD
build_src_filter =
	+<*>
	-<handshake_capture.cpp>
	-<pmkid_capture.cpp>
	-<evil_twin.cpp>
	-<mousejack.cpp>
	-<replay_attack.cpp>
	-<ble_mitm.cpp>
	-<hivemind.cpp>
	-<remote_control.cpp>

[env:hackbox-s3-local]
extends = env:hackbox-main
board = esp32-s3-devkitc1-n16r8
extra_scripts = pre:scripts/platformio_s3_toolchain_fix.py
build_flags = ${env:hackbox-main.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM6
upload_speed = 115200

[env:hardware-test]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	nrf24/RF24@^1.4.10
	olikraus/U8g2@^2.36.2
	adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
build_src_filter =
	+<../hackbox_hardware_test.cpp>
	-<*>
